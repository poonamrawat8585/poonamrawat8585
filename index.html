<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Animation</title>
    <style>
        .ball {
            height: 121px;
            width: 121px;
            background-color: brown;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 50%;
            animation: animateX 3s linear infinite, animateY 1s ease-in-out infinite alternate;
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
            overflow: hidden;
        }

        @keyframes animateX {
            from {
                left: 0;
            }
            to {
                left: 100%;
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }
            to {
                bottom: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>

</html>
